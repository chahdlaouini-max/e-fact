<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inscription</title>
    <link rel="stylesheet" href="pageLogin.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&display=swap"
      rel="stylesheet"
    />
    <script src="controleLogin.js"></script>
  </head>
  <body>
    <form
      class="signup-form"
      onsubmit="return bd()"
      method="post"
      action="valid.html"
    >
      <img src="image001.png" alt="" id="Img1" />
      <h2>Connexion</h2>

      <div class="mb-3">
        <label for="Email">Email</label>
        <input
          type="email"
          id="Email"
          required
          class="Class1"
          placeholder="Email@fake.com"
          onblur=" return verifierInformations()"
          name="Email"
        />
        <div><span id="error1"></span></div>
        <label for="Password">Mot de passe</label>
        <input
          type="password"
          id="Password"
          name="Password"
          required
          class="Class1"
          placeholder="*******"
        />
        <div id="error2"></div>
      </div>
      <button type="submit">Envoyer</button>
    </form>
  </body>
</html>
