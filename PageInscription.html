<body>

    <form class="signup-form">

        <h2>Inscription</h2>

        <div class="mb-3">

            <div class="row">
                <table>
                    <tr>
                        <td><label for="Prenom">Prenom</label>
                              <input type="text" id="Prenom" required class="Class2"></td>
                              <td><label for="Nom">Nom</label>
                             <input type="text" id="Nom" required class="Class2"></td>
                    </tr>
                </table>
      </div>

            <label for="Tel" >Telephone</label>
            <input type="tel" id="Tel" required class="Class1" >
        

        <div class="mb-3">
            <label for="Password">Password</label>
            <input type="password" id="Password" required class="Class1" placeholder="*******">
        </div>
        </div>
        <button type="submit">Submit</button>
    </form>
